name: CI

on:
  push:
    branches-ignore:
      # main lo cubre el workflow de deploy (que tambien corre tests + build).
      # Asi evitamos correr el pipeline dos veces en cada push a main.
      - main
      - master
  pull_request:
    branches: [main, master]

# Si llegan commits encadenados al mismo branch/PR, cancela el run anterior
# para no gastar minutos de Actions en builds que ya quedaron obsoletos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Ya no hace falta --legacy-peer-deps: @vitejs/plugin-basic-ssl se
        # bajo a 1.2.0, que si soporta vite 5. El conflicto de peers que
        # obligaba al parche quedo resuelto.
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    # Pruebas de extremo a extremo: abren la app en un navegador real y la
    # usan como una persona. Cubren lo que la compilacion no ve (pantallas en
    # blanco, botones que desaparecen, datos que no sobreviven a reabrir).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        # Solo WebKit: es el motor de iOS, donde va a correr la app dentro
        # de un WKWebView. Es el entorno mas fiel y el mas exigente.
        run: npx playwright install --with-deps webkit

      - name: Run e2e tests
        run: npm run e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
