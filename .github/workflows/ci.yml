name: CI

on:
  push:
    branches-ignore:
      # main lo cubre el workflow de deploy (que tambien corre tests + build).
      # Asi evitamos correr el pipeline dos veces en cada push a main.
      - main
      - master
  pull_request:
    branches: [main, master]

# Si llegan commits encadenados al mismo branch/PR, cancela el run anterior
# para no gastar minutos de Actions en builds que ya quedaron obsoletos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps SIGUE siendo necesario. Se intento quitarlo el
        # 2026-09-25 tras resolver el conflicto de @vitejs/plugin-basic-ssl
        # con vite 5 (se bajo a 1.2.0), pero `npm ci` a secas falla en CI
        # aunque pase en local con npm 11. Hay otro conflicto de peers que
        # la version de npm de Node 20 si rechaza y no esta identificado:
        # los logs de Actions requieren token para leerse.
        # PENDIENTE: diagnosticar con token o con un paso de depuracion.
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    # Pruebas de extremo a extremo: abren la app en un navegador real y la
    # usan como una persona. Cubren lo que la compilacion no ve (pantallas en
    # blanco, botones que desaparecen, datos que no sobreviven a reabrir).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Mismo motivo que en el job de arriba.
        run: npm ci --legacy-peer-deps

      - name: Install browsers
        # Solo WebKit: es el motor de iOS, donde va a correr la app dentro
        # de un WKWebView. Es el entorno mas fiel y el mas exigente.
        run: npx playwright install --with-deps webkit

      - name: Run e2e tests
        run: npm run e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
